server:
  port: ${PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: sipsa-api
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sipsa_db}
    username: ${DB_USERNAME:sipsa_user}
    password: ${DB_PASSWORD:sipsa_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      idle-timeout: ${DB_IDLE_TIMEOUT:30000}
      pool-name: SipsaHikariCP
  
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  task:
    scheduling:
      pool:
        size: ${TASK_POOL_SIZE:5}
      shutdown:
        await-termination: true
        await-termination-period: 30s

sipsa:
  timezone: ${SIPSA_TIMEZONE:America/Bogota}

  # Pagination configuration
  pagination:
    max-page-size: ${SIPSA_MAX_PAGE_SIZE:1000}       # Maximum for internal queries (prevents memory issues)
    default-page-size: ${SIPSA_DEFAULT_PAGE_SIZE:20}  # Default when user doesn't specify
    max-user-page-size: ${SIPSA_MAX_USER_PAGE_SIZE:100}  # Maximum user can request via API

  soap:
    endpoint: ${SOAP_ENDPOINT:https://appweb.dane.gov.co/sipsaWS/SrvSipsaUpraBeanService}
    namespace: ${SOAP_NAMESPACE:http://servicios.sipsa.co.gov.dane/}
    # Timeouts for robustness (increased for very large datasets like Parcial: 619K+ records)
    # The legacy SOAP service returns large responses without pagination, which can take
    # a long time to stream completely, especially with chunked transfer encoding.
    connect-timeout-ms: ${SOAP_CONNECT_TIMEOUT_MS:30000}   # 30 seconds to establish connection
    read-timeout-ms: ${SOAP_READ_TIMEOUT_MS:3600000}    # 60 minutes for reading large responses

    # Retry Policy
    max-retries: ${SOAP_MAX_RETRIES:3}
    retry-backoff-ms: ${SOAP_RETRY_BACKOFF_MS:2000}

    # Limits
    max-child-elements: ${SOAP_MAX_CHILD_ELEMENTS:0} # Unlimited
    logging-enabled: ${SOAP_LOGGING_ENABLED:false}

  # Scheduling configuration for task scheduler
  scheduling:
    pool-size: ${SIPSA_SCHEDULING_POOL_SIZE:5}
    await-termination-seconds: ${SIPSA_SCHEDULING_AWAIT_TERMINATION:30}

  ingestion:
    # Reduced from 2000 for more frequent saves (less data loss on timeout)
    batch-size: ${INGESTION_BATCH_SIZE:500}

    # Window config (America/Bogota)
    # These windows control when ingestion jobs are ALLOWED to run (validation)
    # Aligned with DANE's data publication schedule (2:00 PM daily)
    daily-window-start: ${DAILY_WINDOW_START:14:20}
    daily-window-end: ${DAILY_WINDOW_END:23:59}

    # Monthly runs allowed on day 8 (MesMadr) and day 10 (AbasMes)
    monthly-run-days: ${MONTHLY_RUN_DAYS:8,10}
    # Monthly data published by DANE around 2:00 PM
    monthly-window-start: ${MONTHLY_WINDOW_START:14:00}

    # Reject thresholds
    max-reject-count: ${MAX_REJECT_COUNT:5000}
    max-reject-rate: ${MAX_REJECT_RATE:0.01}

    # Cron expressions for scheduled jobs
    # All times are in America/Bogota timezone
    # DANE publishes data at 2:00 PM, we add margin for safety
    cron:
      # Daily ingestion: Ciudad, Parcial, Semana
      # Default: Every day at 14:20 (2:20 PM)
      # DANE publishes daily/weekly data at 2:00 PM
      daily: ${SIPSA_CRON_DAILY:0 20 14 * * *}

      # Monthly MesMadr: Day 8 of every month at 14:30 (2:30 PM)
      # DANE updates monthly wholesale data on day 8
      monthly-mes: ${SIPSA_CRON_MONTHLY_MES:0 30 14 8 * *}

      # Monthly AbasMes: Day 10 of every month at 14:30 (2:30 PM)
      # DANE updates monthly supply data on day 10
      monthly-abas: ${SIPSA_CRON_MONTHLY_ABAS:0 30 14 10 * *}

    # Async executor configuration
    async:
      core-pool-size: ${SIPSA_ASYNC_CORE_POOL_SIZE:2}
      max-pool-size: ${SIPSA_ASYNC_MAX_POOL_SIZE:10}
      queue-capacity: ${SIPSA_ASYNC_QUEUE_CAPACITY:25}
      keep-alive-seconds: ${SIPSA_ASYNC_KEEP_ALIVE_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    # Application logging - granular control by package
    com.dalejandrov.sipsa: ${LOG_LEVEL_SIPSA:INFO}
    com.dalejandrov.sipsa.api.controller: ${LOG_LEVEL_API:WARN}
    com.dalejandrov.sipsa.infrastructure.config: ${LOG_LEVEL_CONFIG:INFO}
    com.dalejandrov.sipsa.infrastructure.soap: ${LOG_LEVEL_SOAP:INFO}
    # Framework logging - reduce noise
    org.springframework.web: ${LOG_LEVEL_SPRING_WEB:WARN}
    org.springframework.jdbc: ${LOG_LEVEL_JDBC:WARN}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE:WARN}
    org.apache.cxf.services: ${LOG_LEVEL_CXF:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"


