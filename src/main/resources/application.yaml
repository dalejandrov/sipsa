# ==============================================================================
# SIPSA Integration Service - Base Configuration (production-safe)
# ==============================================================================
# This file contains the production-safe baseline. Values that are part of the
# DANE contract (timezone, SOAP namespace, ingestion windows, cron schedule) are
# fixed here on purpose — they must not vary per environment.
#
# Environment-specific values (credentials, endpoints, tuning knobs) come from
# environment variables. Credentials have NO defaults here: the application
# fails fast at startup if they are missing. Local development defaults live in
# application-dev.yaml (profile "dev").
# ==============================================================================
server:
  port: ${PORT:8080}

# ==============================================================================
# SPRING FRAMEWORK CONFIGURATION
# ==============================================================================
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: sipsa-api

  # ----------------------------------------------------------------------------
  # Database Configuration (PostgreSQL)
  # Credentials are intentionally without defaults — see application-dev.yaml
  # for the local development values.
  # ----------------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sipsa_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      idle-timeout: ${DB_IDLE_TIMEOUT:30000}
      pool-name: SipsaHikariCP

  # ----------------------------------------------------------------------------
  # JPA/Hibernate Configuration
  # ----------------------------------------------------------------------------
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate  # Don't auto-create schema, use Flyway
    open-in-view: false   # Disable to avoid lazy loading issues

  # ----------------------------------------------------------------------------
  # Flyway Database Migration — see ADR-009 and docs/development/database-migrations.md
  # ----------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Fail fast if an already-applied migration was modified after the fact.
    validate-on-migrate: true
    # Never allow `flyway clean` (drops the whole schema) through this app.
    clean-disabled: true
    # Migrations must be applied strictly in version order.
    out-of-order: false
    # Baseline: adopting Flyway on a database that predates it. On an EMPTY
    # schema no baseline is recorded and all migrations run from V1 (verified
    # against a clean PostgreSQL container). On a NON-EMPTY schema without
    # Flyway history, a baseline marker is recorded at version 1 and V1 is
    # skipped — correct only because V1 mirrors that pre-existing schema.
    baseline-on-migrate: true
    baseline-version: 1

  # ----------------------------------------------------------------------------
  # Task Scheduling (Spring default scheduler, not used for SIPSA jobs)
  # ----------------------------------------------------------------------------
  task:
    scheduling:
      pool:
        size: ${TASK_POOL_SIZE:5}
      shutdown:
        await-termination: true
        await-termination-period: 30s

# ==============================================================================
# SIPSA APPLICATION CONFIGURATION
# ==============================================================================
sipsa:
  # ----------------------------------------------------------------------------
  # Global Timezone — fixed by the DANE publication schedule, not per-environment
  # ----------------------------------------------------------------------------
  timezone: America/Bogota

  # ----------------------------------------------------------------------------
  # API Pagination Policy
  # ----------------------------------------------------------------------------
  pagination:
    max-page-size: 1000        # Maximum for internal queries
    default-page-size: 20      # Default page size
    max-user-page-size: 100    # Maximum user can request via API

  # ----------------------------------------------------------------------------
  # SOAP Client Configuration (DANE Web Service)
  # The namespace is part of the WSDL contract and never varies per environment.
  # The endpoint stays overridable to allow pointing at a mock in testing.
  # ----------------------------------------------------------------------------
  soap:
    endpoint: ${SOAP_ENDPOINT:https://appweb.dane.gov.co/sipsaWS/SrvSipsaUpraBeanService}
    namespace: http://servicios.sipsa.co.gov.dane/

    # Timeouts (increased for large datasets like Parcial: 619K+ records)
    connect-timeout-ms: ${SOAP_CONNECT_TIMEOUT_MS:30000}   # 30 seconds
    read-timeout-ms: ${SOAP_READ_TIMEOUT_MS:3600000}       # 60 minutes

    # Retry Policy
    max-retries: ${SOAP_MAX_RETRIES:3}
    retry-backoff-ms: ${SOAP_RETRY_BACKOFF_MS:2000}

    # Limits and Features
    max-child-elements: ${SOAP_MAX_CHILD_ELEMENTS:0}      # 0 = unlimited
    logging-enabled: ${SOAP_LOGGING_ENABLED:false}        # Keep disabled in production

  # ----------------------------------------------------------------------------
  # Scheduling Configuration (SIPSA Custom Scheduler)
  # ----------------------------------------------------------------------------
  scheduling:
    pool-size: ${SIPSA_SCHEDULING_POOL_SIZE:5}
    await-termination-seconds: ${SIPSA_SCHEDULING_AWAIT_TERMINATION:30}

  # ----------------------------------------------------------------------------
  # Data Ingestion Configuration
  # Window and cron values are aligned with DANE's data publication schedule
  # (2:00 PM daily; monthly on days 8 and 10). They are contractual, not
  # environment-specific, so they are fixed here.
  # ----------------------------------------------------------------------------
  ingestion:
    # Batch processing
    batch-size: ${INGESTION_BATCH_SIZE:500}

    # Quality thresholds
    max-reject-count: ${MAX_REJECT_COUNT:5000}
    max-reject-rate: ${MAX_REJECT_RATE:0.01}              # 1% max rejection rate

    # Window validation (America/Bogota timezone)
    # Controls when ingestion jobs are ALLOWED to run
    daily-window-start: "14:20"      # 2:20 PM
    daily-window-end: "23:59"        # 11:59 PM
    monthly-run-days: "8,10"         # Day 8 (MesMadr), Day 10 (AbasMes)
    monthly-window-start: "14:00"    # 2:00 PM

    # Cron expressions for scheduled jobs (America/Bogota timezone)
    # DANE publishes data at 2:00 PM, we add 20-30 minutes margin
    cron:
      # Daily ingestion: Ciudad, Parcial, Semana — every day at 14:20 (2:20 PM)
      daily: "0 20 14 * * *"

      # Monthly MesMadr: Day 8 at 14:30 (2:30 PM)
      monthly-mes: "0 30 14 8 * *"

      # Monthly AbasMes: Day 10 at 14:30 (2:30 PM)
      monthly-abas: "0 30 14 10 * *"

    # Async executor configuration
    async:
      core-pool-size: ${SIPSA_ASYNC_CORE_POOL_SIZE:2}
      max-pool-size: ${SIPSA_ASYNC_MAX_POOL_SIZE:10}
      queue-capacity: ${SIPSA_ASYNC_QUEUE_CAPACITY:25}
      keep-alive-seconds: ${SIPSA_ASYNC_KEEP_ALIVE_SECONDS:60}

# ==============================================================================
# ACTUATOR & MONITORING CONFIGURATION
# `loggers` is exposed only in the dev profile (see application-dev.yaml).
# ==============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# ==============================================================================
# LOGGING CONFIGURATION (production-safe baseline)
# Verbose per-package levels live in application-dev.yaml.
# ==============================================================================
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.dalejandrov.sipsa: ${LOG_LEVEL_SIPSA:INFO}
    org.springframework.web: WARN
    org.springframework.jdbc: WARN
    org.hibernate.SQL: WARN
    org.apache.cxf.services: WARN
