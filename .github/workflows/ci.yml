# CI gate (TECH-120): every pull request and every push to main must pass the
# full build and test suite, including the Flyway migration gate against a real
# PostgreSQL via Testcontainers (ADR-009). The workflow needs no secrets, no
# .env file, and no credentials: the unit suite runs on H2 and the migration
# gate provisions its own throwaway PostgreSQL container on the runner's Docker.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the job only reads the repository. Nothing here writes to
# the repo, publishes packages, or comments on PRs.
permissions:
  contents: read

# One run per branch/PR: a newer push cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & verify (Java 25, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25 (Temurin) with Maven dependency cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run full test suite
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      # FlywayMigrationsTest self-skips when Docker is unavailable
      # (@Testcontainers(disabledWithoutDocker = true)) — correct on a developer
      # laptop, but in CI a silent skip would void the migration gate. Fail the
      # build if the suite did not actually execute.
      - name: Assert the Flyway migration gate ran (not skipped)
        run: |
          report="target/surefire-reports/TEST-com.dalejandrov.sipsa.infrastructure.persistence.FlywayMigrationsTest.xml"
          if [ ! -f "$report" ]; then
            echo "::error::FlywayMigrationsTest report not found — the migration gate did not run at all."
            exit 1
          fi
          suite=$(head -2 "$report" | tail -1)
          tests=$(printf '%s' "$suite" | sed -n 's/.*tests="\([0-9]*\)".*/\1/p')
          skipped=$(printf '%s' "$suite" | sed -n 's/.*skipped="\([0-9]*\)".*/\1/p')
          echo "FlywayMigrationsTest: tests=${tests:-?} skipped=${skipped:-?}"
          if [ "${tests:-0}" -eq 0 ] || [ "${skipped:-0}" -ne 0 ]; then
            echo "::error::FlywayMigrationsTest was skipped (tests=${tests:-0}, skipped=${skipped:-0}). Docker must be available to the runner for the Testcontainers migration gate."
            exit 1
          fi

      - name: Upload test reports (on failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  integration-verify:
    name: Integration tests (WireMock + Testcontainers, TECH-150..155/ADR-011)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Deliberately its own job, not a step chained after `verify` above: a slow or
    # flaky Testcontainers/WireMock startup here must never block the fast unit-test
    # signal (ADR-011). Runs in parallel with `verify` — no `needs:` between them.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25 (Temurin) with Maven dependency cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run the integration-tests profile (*IT via Failsafe)
        run: ./mvnw --batch-mode --no-transfer-progress clean verify -P integration-tests

      # Every handler IT is @Testcontainers(disabledWithoutDocker = true), same
      # self-skip risk FlywayMigrationsTest already guards against in the `verify`
      # job above — a silent skip here would void the whole per-handler IT suite
      # without failing the build.
      - name: Assert all 5 per-handler integration tests ran (not skipped)
        run: |
          set -e
          for handler in Ciudad Semana Mes Abas Parcial; do
            report="target/failsafe-reports/TEST-com.dalejandrov.sipsa.application.ingestion.handler.${handler}IngestionHandlerIT.xml"
            if [ ! -f "$report" ]; then
              echo "::error::${handler}IngestionHandlerIT report not found — it did not run at all."
              exit 1
            fi
            suite=$(head -2 "$report" | tail -1)
            tests=$(printf '%s' "$suite" | sed -n 's/.*tests="\([0-9]*\)".*/\1/p')
            skipped=$(printf '%s' "$suite" | sed -n 's/.*skipped="\([0-9]*\)".*/\1/p')
            echo "${handler}IngestionHandlerIT: tests=${tests:-?} skipped=${skipped:-?}"
            if [ "${tests:-0}" -eq 0 ] || [ "${skipped:-0}" -ne 0 ]; then
              echo "::error::${handler}IngestionHandlerIT was skipped (tests=${tests:-0}, skipped=${skipped:-0}). Docker must be available to the runner for WireMock/Testcontainers."
              exit 1
            fi
          done

      - name: Upload test reports (on failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7
