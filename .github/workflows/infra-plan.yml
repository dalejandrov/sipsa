# Infra plan (TECH-137/TECH-138, ADR-010): validates every Terraform change
# on pull requests touching infra/terraform/ — format, syntax, module tests,
# lint, a Trivy IaC security scan, and (only once the OIDC role below exists)
# a real `terraform plan`.
#
# fmt/validate/test/lint/scan need no AWS credentials and always run — every
# module's own `terraform test` suite (TECH-138: modules/network/tests/;
# TECH-139: modules/database/tests/; TECH-140: modules/ecr/tests/,
# modules/ecs-task/tests/; TECH-141: modules/ecs-service/tests/; TECH-130:
# modules/cognito/tests/; TECH-142: environments/production/tests/, root
# module-wiring only, non-ecs_task modules stubbed via override_module;
# TECH-131: modules/api-gateway/tests/) uses a mocked AWS provider, never a
# real account. The plan step is conditioned on the
# `AWS_TERRAFORM_PLAN_ROLE_ARN` repository variable being set — that role
# does not exist yet (see infra/terraform/README.md and ADR-010's OIDC
# trust-policy contract); creating it is a prerequisite for whichever story
# next needs a real `plan` in CI, not invented here.
#
# Third-party actions are pinned by immutable commit SHA (never a tag or
# `@main`/`@master`) — each pin carries a comment with the human-readable
# version it corresponds to, resolved from the action repository's own tags
# at the time this workflow was written (2026-07-21).
name: Infra Plan

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra-plan.yml'

# Least privilege: read the repo, plus id-token for OIDC federation. Never
# `write-all`. `id-token: write` alone authenticates nothing without the
# AWS-side role trust policy also existing (see ADR-010).
permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: '1.15.7'
  TF_ROOT: infra/terraform/environments/production

jobs:
  fmt-validate:
    name: fmt, validate, test, lint, Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check (all stacks)
        run: terraform fmt -check -recursive infra/terraform

      - name: terraform validate — bootstrap
        working-directory: infra/terraform/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

      - name: terraform validate — environments/production
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform init -backend=false
          terraform validate

      # Mocked AWS provider (mock_provider "aws" {} in the .tftest.hcl file)
      # — no real AWS account is contacted. Add one step per module as more
      # modules gain their own tests/*.tftest.hcl (TECH-130/TECH-132's later
      # phases), rather than a single find-and-loop that hides which module
      # failed.
      - name: terraform test — environments/production (root wiring only, TECH-142)
        working-directory: ${{ env.TF_ROOT }}
        run: terraform test

      - name: terraform test — modules/network
        working-directory: infra/terraform/modules/network
        run: |
          terraform init -backend=false
          terraform test

      - name: terraform test — modules/database
        working-directory: infra/terraform/modules/database
        run: |
          terraform init -backend=false
          terraform test

      - name: terraform test — modules/ecr
        working-directory: infra/terraform/modules/ecr
        run: |
          terraform init -backend=false
          terraform test

      - name: terraform test — modules/ecs-task
        working-directory: infra/terraform/modules/ecs-task
        run: |
          terraform init -backend=false
          terraform test

      - name: terraform test — modules/ecs-service
        working-directory: infra/terraform/modules/ecs-service
        run: |
          terraform init -backend=false
          terraform test

      - name: terraform test — modules/cognito
        working-directory: infra/terraform/modules/cognito
        run: |
          terraform init -backend=false
          terraform test

      - name: terraform test — modules/api-gateway
        working-directory: infra/terraform/modules/api-gateway
        run: |
          terraform init -backend=false
          terraform test

      - name: TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive --chdir=infra/terraform

      # Trivy is the sole IaC scanner (tfsec's checks were folded into Trivy
      # upstream — running both would be redundant tooling for the same
      # class of finding; do not reintroduce tfsec alongside this).
      - name: Trivy IaC config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'infra/terraform'
          exit-code: '1'

  plan:
    name: terraform plan (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: fmt-validate
    # Skips cleanly until the OIDC role exists — see the header comment above.
    if: vars.AWS_TERRAFORM_PLAN_ROLE_ARN != ''

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Uses this repository's dedicated terraform-plan role — read-only,
      # scoped to the state backend and to reading the resources `plan`
      # needs to diff against. Never the same role as terraform-apply or
      # application-deploy (see ADR-010's role-separation contract).
      - name: Configure AWS credentials via OIDC (terraform-plan role)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      # backend.hcl itself is gitignored (real bucket/key, see
      # infra/terraform/environments/production/backend.hcl.example) — wiring
      # it into CI (repository variables or a generated file) is part of the
      # same follow-up that creates AWS_TERRAFORM_PLAN_ROLE_ARN, not done here.
      - name: terraform init
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init -backend-config=backend.hcl

      - name: terraform plan
        working-directory: ${{ env.TF_ROOT }}
        run: terraform plan -input=false -no-color
