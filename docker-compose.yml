services:
  db:
    image: postgres:18.0-alpine3.22
    container_name: sipsa-db
    ports:
      - "5432:5432"
    environment:
      # Local development defaults; override from the shell environment if needed
      # (e.g. DB_PASSWORD=... docker compose up). No .env file is used.
      - POSTGRES_DB=${DB_NAME:-sipsa_db}
      - POSTGRES_USER=${DB_USERNAME:-sipsa_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-sipsa_pass}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - sipsa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sipsa_user} -d ${DB_NAME:-sipsa_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local mock OIDC issuer (navikt/mock-oauth2-server, multi-arch amd64/arm64).
  # DEV-ONLY: issues unsigned-trust JWTs for exercising the API's scoped
  # security locally without any AWS/Cognito dependency (ADR-002). The mock
  # derives the token's `iss` from the Host header it is called with, so tokens
  # must be requested through the same hostname the app validates against
  # (http://oidc:9000/default) — see CONTRIBUTING.md for the one-line /etc/hosts
  # setup and token commands. Contains no real secrets by definition.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:5.0.2
    container_name: sipsa-oidc
    ports:
      - "9000:9000"
    environment:
      - SERVER_PORT=9000
      - JSON_CONFIG_PATH=/app/config.json
    volumes:
      - ./docker/mock-oidc-config.json:/app/config.json:ro
    networks:
      - sipsa-network

  app:
    image: sipsa-app
    build: .
    container_name: sipsa-app
    ports:
      - "8080:8080"
    environment:
      # SPRING_PROFILES_ACTIVE, DB_HOST and DB_PORT are container-topology
      # facts: inside the compose network the app always runs the docker
      # profile (application-docker.yaml) against the `db` service.
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-sipsa_db}
      - DB_USERNAME=${DB_USERNAME:-sipsa_user}
      - DB_PASSWORD=${DB_PASSWORD:-sipsa_pass}
      # JWT issuer: defaults to the compose-internal mock OIDC service
      # (application-docker.yaml). Override from the shell to point at a real
      # issuer (e.g. a dev Cognito user pool) without editing any file.
      - SIPSA_JWT_ISSUER_URI=${SIPSA_JWT_ISSUER_URI:-http://oidc:9000/default}
      - SIPSA_JWT_ALLOWED_CLIENT_IDS=${SIPSA_JWT_ALLOWED_CLIENT_IDS:-}
      # Ingestion batch size: canonical default 500 (TECH-071). Override from
      # the shell (e.g. INGESTION_BATCH_SIZE=250 docker compose up -d) for
      # tuning experiments; values must be 1..10000 or the app refuses to start.
      - INGESTION_BATCH_SIZE=${INGESTION_BATCH_SIZE:-500}
      # Monthly ingestion window start (HH:mm, America/Bogota): canonical 14:00
      # (TECH-133). Authorization gate for monthly runs, not the cron fire time.
      # Invalid values abort startup.
      - INGESTION_MONTHLY_WINDOW_START=${INGESTION_MONTHLY_WINDOW_START:-14:00}
      # Ingestion reject thresholds (TECH-135): a run FAILS when rejects exceed
      # EITHER the absolute count OR the rate (fraction of seen records in [0..1],
      # 0.01 = 1%), evaluated once at the end of the run. Out-of-range values
      # abort startup.
      - MAX_REJECT_COUNT=${MAX_REJECT_COUNT:-5000}
      - MAX_REJECT_RATE=${MAX_REJECT_RATE:-0.01}
      # Async executor pool (TECH-136): geometry of ingestionTaskExecutor — the
      # managed pool every @Async method (audit trail included) runs on.
      # Constraints: core/max >= 1, max >= core, queue >= 0 (0 = direct
      # handoff), keep-alive >= 0 seconds. Invalid values abort startup.
      - SIPSA_ASYNC_CORE_POOL_SIZE=${SIPSA_ASYNC_CORE_POOL_SIZE:-2}
      - SIPSA_ASYNC_MAX_POOL_SIZE=${SIPSA_ASYNC_MAX_POOL_SIZE:-10}
      - SIPSA_ASYNC_QUEUE_CAPACITY=${SIPSA_ASYNC_QUEUE_CAPACITY:-25}
      - SIPSA_ASYNC_KEEP_ALIVE_SECONDS=${SIPSA_ASYNC_KEEP_ALIVE_SECONDS:-60}
      # Health indicator staleness thresholds (TECH-031): max age of the last
      # successful run before SipsaHealthIndicator reports a monitored method
      # DOWN. Defaults preserve the original hardcoded behavior (36h daily,
      # 840h = 35 days monthly). Must be positive; invalid values abort startup.
      - SIPSA_HEALTH_DAILY_STALENESS_THRESHOLD=${SIPSA_HEALTH_DAILY_STALENESS_THRESHOLD:-36h}
      - SIPSA_HEALTH_MONTHLY_STALENESS_THRESHOLD=${SIPSA_HEALTH_MONTHLY_STALENESS_THRESHOLD:-840h}
      # SOAP client configuration (TECH-070): SoapProperties now validates every
      # value below at startup (endpoint/namespace non-blank, timeouts > 0,
      # retry/logging/XML-limit counters >= 0 — 0 is a real value for
      # max-child-elements [unlimited] and logging-limit-bytes [nothing
      # logged], not "disabled"). namespace and logging-limit-bytes have no
      # env var here: namespace is a fixed WSDL-contract literal that never
      # varies per environment, and logging-limit-bytes only matters when
      # logging-enabled=true (dev/debug only).
      - SOAP_ENDPOINT=${SOAP_ENDPOINT:-https://appweb.dane.gov.co/sipsaWS/SrvSipsaUpraBeanService}
      - SOAP_CONNECT_TIMEOUT_MS=${SOAP_CONNECT_TIMEOUT_MS:-30000}
      - SOAP_READ_TIMEOUT_MS=${SOAP_READ_TIMEOUT_MS:-3600000}
      - SOAP_MAX_RETRIES=${SOAP_MAX_RETRIES:-3}
      - SOAP_RETRY_BACKOFF_MS=${SOAP_RETRY_BACKOFF_MS:-2000}
      - SOAP_MAX_CHILD_ELEMENTS=${SOAP_MAX_CHILD_ELEMENTS:-0}
      - SOAP_LOGGING_ENABLED=${SOAP_LOGGING_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
      oidc:
        condition: service_started
    networks:
      - sipsa-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  sipsa-network:
    driver: bridge

volumes:
  postgres-data:
    name: sipsa-postgres-data
